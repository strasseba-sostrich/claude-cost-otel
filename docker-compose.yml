services:
  otelcol:
    image: otel/opentelemetry-collector-contrib:0.158.0
    container_name: otelcol
    volumes:
      - ./otelcol.yaml:/etc/otelcol-contrib/config.yaml
    restart: unless-stopped
    ports:
      - 127.0.0.1:4317:4317
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
      - --enable-feature=otlp-deltatocumulative
      # Enable Prometheus to accept OTLP writes directly
      - --web.enable-otlp-receiver
    ports:
      - 127.0.0.1:9090:9090

  loki:
    image: grafana/loki:3.4.2
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml
      - loki_data:/loki
    ports:
      - 127.0.0.1:3100:3100

  jaeger:
    image: jaegertracing/jaeger:2.20.0
    container_name: jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - 127.0.0.1:16686:16686

  perses:
    image: persesdev/perses:v0.54.0
    container_name: perses
    user: "0:0"   # volume is root-owned; image runs non-root and cannot mkdir
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - ./perses/config.yaml:/etc/perses/config.yaml
      - ./perses/provisioning:/etc/perses/provisioning
      - perses_data:/etc/perses/data
    depends_on:
      - prometheus
      - loki
      - jaeger

volumes:
  prometheus_data:
  perses_data:
  loki_data:
