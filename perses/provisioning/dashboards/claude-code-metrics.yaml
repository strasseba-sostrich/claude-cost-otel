kind: "Dashboard"
metadata:
  name: "claude-code-metrics"
  project: "ai-agents"
spec:
  display:
    name: "Claude Code overview"
    description: >-
      The few Claude Code usage numbers worth watching: sessions, cost, tokens,
      prompt-cache hit ratio, and cost and token trends. Per-agent and per-tool
      cost lives on the Agent cost dashboard.
  duration: "6h"
  refreshInterval: "30s"
  variables:
    - kind: "ListVariable"
      spec:
        name: "organization"
        display:
          name: "Organization"
        allowMultiple: true
        allowAllValue: true
        defaultValue: "$__all"
        customAllValue: ".*"
        plugin:
          kind: "PrometheusLabelValuesVariable"
          spec:
            labelName: "organization_id"
            matchers:
              - "claude_code_cost_usage_USD_total"
            datasource:
              kind: "PrometheusDatasource"
              name: "prometheus"
    - kind: "ListVariable"
      spec:
        name: "user"
        display:
          name: "User"
        allowMultiple: true
        allowAllValue: true
        defaultValue: "$__all"
        customAllValue: ".*"
        plugin:
          kind: "PrometheusLabelValuesVariable"
          spec:
            labelName: "user_email"
            matchers:
              - 'claude_code_cost_usage_USD_total{organization_id=~"$organization"}'
            datasource:
              kind: "PrometheusDatasource"
              name: "prometheus"
    - kind: "ListVariable"
      spec:
        name: "model"
        display:
          name: "Model"
        allowMultiple: true
        allowAllValue: true
        defaultValue: "$__all"
        customAllValue: ".*"
        plugin:
          kind: "PrometheusLabelValuesVariable"
          spec:
            labelName: "model"
            matchers:
              - 'claude_code_token_usage_tokens_total{organization_id=~"$organization"}'
            datasource:
              kind: "PrometheusDatasource"
              name: "prometheus"

  panels:
    sessions:
      kind: "Panel"
      spec:
        display:
          name: "Sessions"
          description: "Sessions with cost activity in the selected time range"
        plugin:
          kind: "StatChart"
          spec:
            calculation: "last"
            format:
              unit: "decimal"
              decimalPlaces: 0
            thresholds:
              steps:
                - value: 0
                  color: "blue"
        queries:
          - kind: "TimeSeriesQuery"
            spec:
              plugin:
                kind: "PrometheusTimeSeriesQuery"
                spec:
                  query: 'count(count by (session_id) (last_over_time(claude_code_cost_usage_USD_total{organization_id=~"$organization", user_email=~"$user", model=~"$model"}[$__range]))) or vector(0)'
                  seriesNameFormat: "Sessions"

    totalCost:
      kind: "Panel"
      spec:
        display:
          name: "Total Cost"
          description: "Total estimated cost in USD based on token usage and model pricing"
        plugin:
          kind: "StatChart"
          spec:
            calculation: "last"
            format:
              unit: "usd"
              decimalPlaces: 2
            thresholds:
              steps:
                - value: 0
                  color: "green"
                - value: 100
                  color: "yellow"
                - value: 500
                  color: "red"
        queries:
          - kind: "TimeSeriesQuery"
            spec:
              plugin:
                kind: "PrometheusTimeSeriesQuery"
                spec:
                  query: 'sum(increase(claude_code_cost_usage_USD_total{organization_id=~"$organization", user_email=~"$user", model=~"$model"}[$__range]) or last_over_time(claude_code_cost_usage_USD_total{organization_id=~"$organization", user_email=~"$user", model=~"$model"}[$__range]))'
                  seriesNameFormat: "Cost"

    totalTokens:
      kind: "Panel"
      spec:
        display:
          name: "Total Tokens"
          description: "Total tokens consumed including input, output, cache read, and cache creation tokens"
        plugin:
          kind: "StatChart"
          spec:
            calculation: "last"
            format:
              unit: "decimal"
              decimalPlaces: 0
              shortValues: true
            thresholds:
              steps:
                - value: 0
                  color: "purple"
        queries:
          - kind: "TimeSeriesQuery"
            spec:
              plugin:
                kind: "PrometheusTimeSeriesQuery"
                spec:
                  query: 'sum(increase(claude_code_token_usage_tokens_total{organization_id=~"$organization", user_email=~"$user", model=~"$model"}[$__range]) or last_over_time(claude_code_token_usage_tokens_total{organization_id=~"$organization", user_email=~"$user", model=~"$model"}[$__range]))'
                  seriesNameFormat: "Tokens"

    cacheHitRatio:
      kind: "Panel"
      spec:
        display:
          name: "Cache hit ratio"
          description: >-
            Fraction of input tokens served from the prompt cache: cacheRead /
            (cacheRead + cacheCreation + input), over the selected range. Higher
            means cheaper. Well below 90% in a long session means the cached
            prefix keeps changing or expiring.
        plugin:
          kind: "GaugeChart"
          spec:
            calculation: "last"
            max: 1
            format:
              unit: "percent-decimal"
              decimalPlaces: 0
            thresholds:
              steps:
                - value: 0
                  color: "red"
                - value: 0.6
                  color: "orange"
                - value: 0.8
                  color: "yellow"
                - value: 0.9
                  color: "green"
        queries:
          - kind: "TimeSeriesQuery"
            spec:
              plugin:
                kind: "PrometheusTimeSeriesQuery"
                spec:
                  query: 'sum(increase(claude_code_token_usage_tokens_total{organization_id=~"$organization", user_email=~"$user", model=~"$model", type="cacheRead"}[$__range]) or last_over_time(claude_code_token_usage_tokens_total{organization_id=~"$organization", user_email=~"$user", model=~"$model", type="cacheRead"}[$__range])) / sum(increase(claude_code_token_usage_tokens_total{organization_id=~"$organization", user_email=~"$user", model=~"$model", type=~"cacheRead|cacheCreation|input"}[$__range]) or last_over_time(claude_code_token_usage_tokens_total{organization_id=~"$organization", user_email=~"$user", model=~"$model", type=~"cacheRead|cacheCreation|input"}[$__range]))'
                  seriesNameFormat: "cache hit ratio"

    costByModelTimeseries:
      kind: "Panel"
      spec:
        display:
          name: "Cost by Model (USD/h)"
          description: "Spend rate per Claude model"
        plugin:
          kind: "TimeSeriesChart"
          spec:
            yAxis:
              format:
                unit: "usd"
        queries:
          - kind: "TimeSeriesQuery"
            spec:
              plugin:
                kind: "PrometheusTimeSeriesQuery"
                spec:
                  query: 'sum(rate(claude_code_cost_usage_USD_total{organization_id=~"$organization", user_email=~"$user", model=~"$model"}[$__rate_interval])) by (model) * 3600'
                  seriesNameFormat: "{{model}}"

    tokenUsageByType:
      kind: "Panel"
      spec:
        display:
          name: "Token Usage by Type"
          description: "Token rate by type: input, output, cacheRead, cacheCreation"
        plugin:
          kind: "TimeSeriesChart"
          spec: {}
        queries:
          - kind: "TimeSeriesQuery"
            spec:
              plugin:
                kind: "PrometheusTimeSeriesQuery"
                spec:
                  query: 'sum(rate(claude_code_token_usage_tokens_total{organization_id=~"$organization", user_email=~"$user", model=~"$model"}[$__rate_interval])) by (type)'
                  seriesNameFormat: "{{type}}"

  layouts:
    - kind: "Grid"
      spec:
        display:
          title: "Overview"
        items:
          - x: 0
            y: 0
            width: 6
            height: 6
            content:
              $ref: "#/spec/panels/sessions"
          - x: 6
            y: 0
            width: 6
            height: 6
            content:
              $ref: "#/spec/panels/totalCost"
          - x: 12
            y: 0
            width: 6
            height: 6
            content:
              $ref: "#/spec/panels/totalTokens"
          - x: 18
            y: 0
            width: 6
            height: 6
            content:
              $ref: "#/spec/panels/cacheHitRatio"

    - kind: "Grid"
      spec:
        display:
          title: "Trends"
        items:
          - x: 0
            y: 0
            width: 12
            height: 8
            content:
              $ref: "#/spec/panels/costByModelTimeseries"
          - x: 12
            y: 0
            width: 12
            height: 8
            content:
              $ref: "#/spec/panels/tokenUsageByType"
